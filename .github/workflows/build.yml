name: Build theme

on:
  push:
    branches: [main]
    paths: ['theme/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['theme/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: |
          find theme/mid-hudson-misfits -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JSON
        run: |
          for f in theme/mid-hudson-misfits/theme.json theme/mid-hudson-misfits/styles/blocks/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok $f"
          done

      - name: Build installable zip
        run: |
          mkdir -p dist
          cd theme
          zip -qr ../dist/mid-hudson-misfits.zip mid-hudson-misfits -x '*/.DS_Store'

      - uses: actions/upload-artifact@v4
        with:
          name: mid-hudson-misfits-theme
          path: dist/mid-hudson-misfits.zip
          retention-days: 30
